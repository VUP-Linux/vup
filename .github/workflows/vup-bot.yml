name: VUP Bot

on:
  pull_request_target:
    types: [synchronize]
  workflow_run:
    workflows: ["PR Build", "Template Check", "PR Title Check"]
    types:
      - completed

cache-mode: none

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # This trusted event only invalidates labels; it never checks out PR code.
  reset-build-labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Require a new build for the updated commit
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            if (current.head.sha !== pr.head.sha) return;
            for (const name of ['ok-to-build', 'build-passed']) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: pr.number, name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  report-status:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'PR Build' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.VUP_BOT_APP_ID }}
          private-key: ${{ secrets.VUP_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      # No build artifacts are downloaded or executed in this privileged job.
      - name: Report compilation result
        uses: actions/github-script@v9
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { reportBuild } = require('./.github/scripts/pr-report.cjs');
            const reader = new github.constructor({ auth: process.env.ACTIONS_READ_TOKEN });
            await reportBuild({ github, reader, context, core });

  report-pr-check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && contains(fromJson('["Template Check", "PR Title Check"]'), github.event.workflow_run.name) && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.VUP_BOT_APP_ID }}
          private-key: ${{ secrets.VUP_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Checkout trusted reporting scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download PR Check Report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-check-report
          path: ${{ runner.temp }}/pr-check-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR Check Comment
        if: steps.download-report.outcome == 'success'
        uses: actions/github-script@v9
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            const workflowName = context.payload.workflow_run.name;
            const marker = workflowName === 'Template Check'
              ? '<!-- template-check -->'
              : '<!-- pr-title-check -->';

            const { resolvePullRequest } = require('./.github/scripts/pr-report.cjs');
            const reader = new github.constructor({ auth: process.env.ACTIONS_READ_TOKEN });
            const resolved = await resolvePullRequest({ github: reader, context, core });
            if (!resolved) return;
            const prNumber = resolved.pr.number;
            const path = require('path');
            const reportDir = path.join(process.env.RUNNER_TEMP, 'pr-check-report');
            const status = fs.readFileSync(path.join(reportDir, 'status.txt'), 'utf8').trim();
            if (!['success', 'warning', 'failure'].includes(status)) {
              throw new Error('Invalid PR check status');
            }
            const detailsPath = path.join(reportDir, 'details.txt');
            const details = fs.existsSync(detailsPath)
              ? fs.readFileSync(detailsPath, 'utf8').trim()
              : '';

            function escapeHtml(value) {
              return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            }

            function escapeInlineCode(value) {
              return value.replace(/`/g, '\\`');
            }

            function preformatted(value) {
              return `<pre>${escapeHtml(value)}</pre>`;
            }

            let shouldComment = false;
            let commentBody = '';

            if (workflowName === 'Template Check') {
              if (status === 'failure') {
                shouldComment = true;
                commentBody = [
                  '### :x: Template Validation Failed',
                  '',
                  'Your template has issues that must be fixed before this PR can be built:',
                  '',
                  preformatted(details),
                  '',
                  'Fix the errors above, push your changes, and the check will re-run automatically.',
                ].join('\n');
              } else if (status === 'warning') {
                shouldComment = true;
                commentBody = [
                  '### :warning: Template Validation Passed (with warnings)',
                  '',
                  preformatted(details),
                ].join('\n');
              }
            } else if (status === 'failure') {
              shouldComment = true;
              commentBody = [
                ':warning: PR title does not follow conventions.',
                '',
                '**New package:** `feat: add <pkgname>` or `feat: add <pkgname> <version>`',
                '**Update:** `<pkgname>: update to <version>`',
                '**Other:** `fix:`, `chore:`, `docs:`, `ci:`, `refactor:`, `test:`',
                '',
                `Current title: \`${escapeInlineCode(details)}\``,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (!shouldComment || !commentBody) {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                });
              }
              return;
            }

            // Artifact details come from a pull_request workflow. Avoid pings
            // and markers being echoed back through the bot comment.
            commentBody = commentBody
              .replace(/<!--\s*(template-check|pr-title-check)\s*-->/g, '')
              .replace(/@/g, '@<!-- -->')
              .trim();

            const maxCommentLength = 60000;
            if (commentBody.length > maxCommentLength) {
              commentBody = `${commentBody.slice(0, maxCommentLength)}\n\n... output truncated.`;
            }

            const body = `${marker}\n${commentBody}`;
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
