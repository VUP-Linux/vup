name: PR Build
run-name: 'PR Build #${{ github.event.pull_request.number }} (${{ github.event.label.name }})'

on:
  pull_request:
    types: [labeled]

# Package recipes execute arbitrary code. Give these disposable jobs no cache
# access, secrets, publishing permissions, or persistent checkout credentials.
cache-mode: none

env:
  XBPS_ALLOW_RESTRICTED: yes
  XBPS_ALLOW_CHROOT_BREAKOUT: yes

permissions:
  contents: read

jobs:
  check-changes:
    if: github.event.label.name == 'ok-to-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      should_run: ${{ steps.set-matrix.outputs.should_run }}
    steps:
      - name: Checkout (PR code for diff)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Systems to Build
        id: set-matrix
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          python3 vup/scripts/check_changes.py

  verify-build:
    name: Build packages (${{ matrix.category }} / ${{ matrix.arch }})
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # The runner logs in to GHCR with GITHUB_TOKEN before starting this job.
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/vup-linux/vup-builder:latest
      options: --privileged
    strategy:
      matrix: ${{ fromJson(needs.check-changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4

    concurrency:
      group: pr-vup-${{ github.event.pull_request.number }}-${{ matrix.category }}-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - name: Checkout VUP
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: vup
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout void-packages (Build System)
        uses: actions/checkout@v7
        with:
          repository: void-linux/void-packages
          path: void-packages
          persist-credentials: false

      - name: Setup xbps-src
        run: |
          cd void-packages
          cp ../vup/vup/xbps-src .
          mkdir -p srcpkgs/core/xbps-triggers
          cp -r ../vup/vup/srcpkgs/core/xbps-triggers/* srcpkgs/core/xbps-triggers/
          chmod +x xbps-src
          echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf

      - name: Binary Bootstrap
        run: |
          cd void-packages
          ./xbps-src binary-bootstrap

      - name: Build Modified Packages
        id: compile
        env:
          CATEGORY: ${{ matrix.category }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          cd void-packages
          [[ "$CATEGORY" =~ ^[A-Za-z0-9][A-Za-z0-9+_.-]*$ ]] || exit 1
          cat_path="../vup/vup/srcpkgs/$CATEGORY"

          if [ "$PACKAGES" = "ALL" ]; then
            shopt -s nullglob
            PKGS=()
            for pkgpath in "$cat_path"/*; do
              [ -d "$pkgpath" ] && PKGS+=("${pkgpath##*/}")
            done
          else
            read -r -a PKGS <<< "$PACKAGES"
          fi

          mkdir -p ../reports
          REPORT_FILE="../reports/report-$CATEGORY.json"

          echo "[]" > "$REPORT_FILE"
          failures=0
          built=0

          for pkgname in "${PKGS[@]}"; do
            [[ "$pkgname" =~ ^[A-Za-z0-9][A-Za-z0-9+_.-]*$ ]] || exit 1
            pkgpath="$cat_path/$pkgname"
            [ ! -d "$pkgpath" ] && continue

            echo "Building $pkgname..."
            rm -rf "srcpkgs/$pkgname"
            cp -r "$pkgpath" "srcpkgs/"

            status="pending"
            if vuru src pkg "$pkgname" > build.log 2>&1; then
              status="success"
            else
              echo "Build FAILED: $pkgname"
              status="failure"
              failures=$((failures + 1))
              cat build.log
            fi

            python3 ../vup/vup/scripts/update_report.py "$REPORT_FILE" "$pkgname" "$status" "build.log"
            built=$((built + 1))

            rm -rf "srcpkgs/$pkgname"
          done

          echo "Built $built package(s); $failures failed."
          [ "$built" -gt 0 ] && [ "$failures" -eq 0 ]

      - name: Upload Build Reports
        if: ${{ always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-report-${{ matrix.category }}
          path: reports/*.json
          retention-days: 7
          if-no-files-found: warn
